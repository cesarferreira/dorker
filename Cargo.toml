[package]
name = "dorker"
version = "0.1.5"
edition = "2024"
rust-version = "1.85"
description = "Docker for headless Android emulator environments"
license = "MIT"
authors = ["Cesar Ferreira"]
repository = "https://github.com/cesarferreira/dorker"

[[bin]]
name = "dorker"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
